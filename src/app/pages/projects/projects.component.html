<app-project-shell
  class="projects-landing"
  accent="#9abcc9"
  footerLabel="Experiments · Tools · Play"
  [chromatic]="true"
  [showProjectsLink]="false"
>
  <main class="project-main">
    <section class="project-intro" aria-labelledby="projects-title">
      <span class="project-kicker">FlyingPAD experiments</span>
      <h1 id="projects-title">Projects<span>.</span></h1>
      <p>Small tools, games and interactive experiments built to test ideas.</p>
    </section>

    <section class="system" aria-label="Project system">
      <div class="project-section-heading">
        <span>Project system</span>
        <span>01 / 09</span>
      </div>

      <div class="system-grid">
        <div class="project-card missing" aria-hidden="true">
          <span class="project-index">01</span>
          <span class="missing-core"></span>
        </div>

        @for (project of projects; track project.index) {
          <a
            [class]="'project-card tone-' + project.tone"
            [routerLink]="project.route"
            [attr.aria-label]="project.name + ' — ' + project.detail"
          >
            <span class="project-index">{{ project.index }}</span>
            <span class="project-signal" aria-hidden="true"></span>
            <div class="project-copy">
              <h2>{{ project.name }}</h2>
              <p>{{ project.detail }}</p>
            </div>
            <span class="project-arrow" aria-hidden="true">→</span>
          </a>
        }
      </div>
    </section>
  </main>
</app-project-shell>
