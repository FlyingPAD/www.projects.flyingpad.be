<div class="project-page">
  <header class="site-header">
    <a class="identity" routerLink="/projects">FlyingPAD <span>/ Projects</span></a>
    <nav><a routerLink="/projects">Projects</a><a routerLink="/about">About</a><a routerLink="/settings">Settings</a></nav>
  </header>

  <main>
    <section class="intro">
      <span class="kicker">09 / Timing challenge</span>
      <h1>Reaction<br><span>Time.</span></h1>
      <p>Wait for the signal. Click as fast as you can.</p>
      @if(bestTime !== null) {
        <div class="best"><span>Best this session</span><strong>{{ bestTime }} ms</strong></div>
      }
    </section>

    <section class="workspace">
      <div class="section-heading"><span>Reaction test</span><span>{{ state }}</span></div>
      <button
        type="button"
        class="reaction-zone"
        [class.waiting]="state === 'waiting'"
        [class.ready]="state === 'ready'"
        [class.failed]="state === 'too-soon'"
        (click)="state === 'idle' || state === 'result' || state === 'too-soon' ? start() : react()"
      >
        @switch(state) {
          @case('idle') { <span>Start</span><strong>Click to begin</strong> }
          @case('waiting') { <span>Wait</span><strong>Not yet...</strong> }
          @case('ready') { <span>Now</span><strong>Click!</strong> }
          @case('result') { <span>Result</span><strong>{{ reactionTime }} ms</strong><small>Click to try again</small> }
          @case('too-soon') { <span>Too soon</span><strong>False start</strong><small>Click to restart</small> }
        }
      </button>
    </section>
  </main>

  <footer><span>FlyingPAD Projects</span><span>09 / Reaction Time</span></footer>
</div>
